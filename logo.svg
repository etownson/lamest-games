<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t">
  <title id="t">Lamest Games</title>
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- slightly tilted, slightly sad controller -->
  <g transform="translate(100 100) rotate(-8)">
    <path d="M-78 -34 Q-82 -50 -60 -50 L60 -50 Q82 -50 78 -34 L90 30 Q96 62 66 58 Q48 56 36 30 L-36 30 Q-48 56 -66 58 Q-96 62 -90 30 Z"
          fill="url(#pad)" stroke="#1a1033" stroke-width="7" stroke-linejoin="round"/>
    <!-- d-pad eye -->
    <path d="M-50 -24 h10 v-10 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 z" fill="#1a1033"/>
    <!-- button eye, half-lidded -->
    <path d="M26 -22 A12 12 0 0 0 50 -22 Z" fill="#1a1033"/>
    <line x1="24" y1="-22" x2="52" y2="-22" stroke="#1a1033" stroke-width="5" stroke-linecap="round"/>
    <!-- meh mouth -->
    <path d="M4 14 q4 12 12 6 q2 -6 -2 -8 z" fill="#ff7aa8" stroke="#1a1033" stroke-width="3" stroke-linejoin="round"/><path d="M-24 6 Q-12 22 0 14 Q10 8 22 12" fill="none" stroke="#1a1033" stroke-width="6" stroke-linecap="round"/>
    <!-- sweat drop -->
    <path d="M70 -62 q8 12 0 18 q-8 -6 0 -18z" fill="#5ee7ff" stroke="#1a1033" stroke-width="3"/>
  </g>
  <text x="210" y="98" font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900"
        font-size="72" fill="#ffd23f" stroke="#1a1033" stroke-width="3" paint-order="stroke">LAMEST</text>
  <text x="212" y="160" font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900"
        font-size="58" letter-spacing="9" fill="#ff4fa3" stroke="#1a1033" stroke-width="3" paint-order="stroke">GAMES</text>
  <text x="520" y="160" font-family="'Courier New',monospace" font-size="18" fill="#9aa0c8">™-ish</text>
</svg>
